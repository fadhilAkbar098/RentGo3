<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk – RentGo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
  colors: { brand: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 900:'#1e3a8a' } }
}}};
</script>
<style type="text/tailwindcss">
  body { @apply bg-brand-50 text-slate-700 font-sans antialiased; }
  .field { @apply w-full rounded-xl border border-brand-100 bg-brand-50/60 px-3.5 py-3 text-sm text-slate-800 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30; }
  .lbl   { @apply block text-xs font-medium text-slate-500 mb-1.5; }
  .btn   { @apply w-full inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-brand-700 to-brand-500 text-white font-semibold py-3.5 shadow-lg shadow-brand-600/25 transition hover:brightness-110 active:scale-[.98]; }
</style>
</head>

<body class="min-h-screen">
<main class="min-h-screen grid lg:grid-cols-2">

  <!-- Panel kiri -->
  <section class="relative hidden lg:flex flex-col justify-between p-12 text-white bg-gradient-to-br from-brand-900 via-brand-700 to-brand-500 overflow-hidden">
    <div class="text-3xl font-extrabold tracking-tight">RentGo</div>
    <div class="relative z-10 max-w-md">
      <h1 class="text-4xl font-extrabold leading-tight">Perjalanan nyaman bersama kami.</h1>
      <p class="mt-4 text-brand-100">Rental mobil, motor, dan travel keluarga. Aman, terpercaya, dan hemat.</p>
    </div>
    <img src="web/img/avanza.png" alt="" onerror="this.remove()" class="absolute -right-10 bottom-4 w-[32rem] max-w-none drop-shadow-2xl">
  </section>

  <!-- Form login -->
  <section class="flex items-center justify-center p-6">
    <div class="w-full max-w-sm">
      <div class="lg:hidden mb-8 text-center">
        <div class="text-3xl font-extrabold text-brand-700">RentGo</div>
        <p class="text-sm text-slate-500">Rental Mobil &amp; Motor · Travel Keluarga</p>
      </div>
      <h2 id="title" class="text-2xl font-extrabold text-brand-900">Masuk ke akun</h2>
      <p id="sub" class="text-sm text-slate-500 mt-1 mb-6">Masukkan akun Anda untuk melanjutkan.</p>

      <form id="form" class="space-y-4" novalidate>
        <div id="nameWrap" class="hidden"><label class="lbl" for="name">Nama lengkap</label>
          <input id="name" class="field" autocomplete="name" placeholder="Nama Anda"></div>
        <div><label id="idLbl" class="lbl" for="id">Username atau email</label>
          <input id="id" class="field" autocomplete="username" placeholder="Username atau email" autofocus></div>
        <div><label class="lbl" for="pw">Kata sandi</label>
          <div class="relative">
            <input id="pw" type="password" class="field pr-16" autocomplete="current-password" placeholder="Kata sandi">
            <button type="button" id="toggle" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-brand-600">Lihat</button>
          </div></div>
        <div id="pw2Wrap" class="hidden"><label class="lbl" for="pw2">Ulangi kata sandi</label>
          <input id="pw2" type="password" class="field" autocomplete="new-password" placeholder="Ulangi kata sandi"></div>
        <p id="err" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></p>
        <button id="submit" class="btn">Masuk</button>
      </form>
      <p class="text-sm text-center text-slate-500 mt-6"><span id="swapText">Belum punya akun?</span>
        <button type="button" id="swap" class="font-semibold text-brand-600">Daftar</button></p>
    </div>
  </section>
</main>

<script src="login.js"></script>
</body>
</html>
